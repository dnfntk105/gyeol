<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>길드 홈페이지</title><!-- 길드장 전용: 주소 끝에 #admin 을 붙이면 추첨 설정이 보입니다 -->
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--card:#fff;--tx:#23201b;--mu:#7a746a;--ac:#b4472a;--bd:#e2ddd2}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17161a;--card:#222126;--tx:#ece8df;--mu:#9a958a;--ac:#e8845f;--bd:#34323a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;padding:10px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:16px}.card .d{color:var(--mu);font-size:12px;margin-bottom:6px}.card p{margin:0;white-space:pre-wrap;font-size:14px}
input,textarea,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px;margin-bottom:8px}
textarea{min-height:70px}
.btn{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-size:14px;cursor:pointer}
.btn.g{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:4px 10px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{color:var(--mu);text-align:center;padding:30px 0;font-size:14px}
canvas{width:100%;max-width:400px;display:block;margin:0 auto 10px;border-radius:12px;background:#15131a}
.rank{font-size:13px;display:flex;flex-wrap:wrap;gap:4px}.rank span{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 9px}
.win{font-size:18px;font-weight:700;color:var(--ac);text-align:center;margin:6px 0}
.hide{display:none}
</style></head><body><div class="wrap">
<div class="row" style="justify-content:space-between"><h1 id="h1">⚔️ 우리 길드</h1></div><div class="sub" id="tag"></div><div class="sub" id="who">불러오는 중…</div>
<div class="tabs" id="tabs"></div>
<div id="v-notice"></div><div id="v-event" class="hide"></div><div id="v-result" class="hide"></div>
<div id="v-pin" class="hide">
 <canvas id="cv" width="800" height="1200"></canvas>
 <div class="win" id="win"></div>
 <div class="row" style="justify-content:center;margin-bottom:8px"><span style="font-size:13px;color:var(--mu)">배속</span>
  <button class="btn g" data-s="1">x1</button><button class="btn g" data-s="3">x3</button><button class="btn g" data-s="6">x6</button><button class="btn g" data-s="10">x10</button></div>
 <div class="rank" id="rank"></div>
 <div id="adm" class="card hide" style="margin-top:12px">
  <h3>🎲 추첨 설정 (길드장 전용)</h3><div class="d">끝나면 아래에 리플레이 코드가 나옵니다. 저한테 보내주시면 경기결과에 등록해 드려요.</div>
  <textarea id="names" placeholder="길드원 닉네임 (한 줄에 한 명)"></textarea>
  
  <input id="ttl" placeholder="추첨 제목 (예: 10월 길드전 보상)">
  <select id="mode"><option value="first">가장 먼저 골인한 공이 당첨</option><option value="last">가장 마지막에 골인한 공이 당첨</option></select>
  <button class="btn" id="go" style="width:100%">추첨 시작</button>
 </div>
 <p class="sub" id="pinhint" style="text-align:center;margin-top:10px">지난 추첨은 경기결과 탭에서 리플레이로 다시 볼 수 있어요.</p>
</div></div>
<script>
const $=s=>document.querySelector(s);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const W=400,H=1500,R=7,GY=1440;
const SP=[[120,330,1.6],[280,590,-1.6],[120,850,1.9],[280,1110,-1.9]].map(a=>({x:a[0],y:a[1],w:a[2],l:58}));
const SEG=[[0,1290,185,1400],[400,1290,215,1400]];const SPX=SP.concat([{x:200,y:1315,w:3.2,l:20}]);
const JET=[[0,690,50,750],[350,690,400,750],[0,1150,50,1210],[350,1150,400,1210]];
const pegs=[];{const m=rng(7);for(let y=140,r=0;y<1260;y+=65,r++)for(let x=r%2?30:60;x<W;x+=60)if(m()>.12&&!SP.some(s=>Math.abs(s.y-y)<48))pegs.push([x,y]);}
function Sim(seed,names,mode,jp,mv){
 const r=this.r=rng(seed);Object.assign(this,{mv:mv||0,jp:jp??.4,mode,t:0,order:[],fin:false,ang:0,names});
 this.b=names.map((n,i)=>({n,i,x:24+(i%12)*29+r()*4,y:20+Math.floor(i/12)*18,vx:(r()-.5)*80,vy:0,j:0,s:0,done:false,bt:-9,h:(i*47)%360}));
}
Sim.prototype.step=function(){
 const dt=1/120,r=this.r,al=this.b.filter(b=>!b.done);this.t+=dt;this.ang+=dt;
 for(const b of al){
  b.px=b.x;b.py=b.y;b.vy+=1000*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)*.5}if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx)*.5}
  for(const p of pegs)push(b,p[0],p[1],5,0,0,1.5);
  for(const s of(this.mv>=2?SPX:SP)){const c=Math.cos(this.ang*s.w),n=Math.sin(this.ang*s.w);seg(b,s.x-c*s.l,s.y-n*s.l,s.x+c*s.l,s.y+n*s.l,s.w,s.x,s.y)}
  for(const g of SEG)seg(b,g[0],g[1],g[2],g[3],0,0,0);
  for(const z of JET)if(!b.j&&b.x>z[0]&&b.x<z[2]&&b.y>z[1]&&b.y<z[3]){b.j=1;if(r()<this.jp){b.vy=-900;b.vx=(W/2-b.x)*1.3;b.bt=this.t;this.jb=b;this.jt=this.t}}
  if(this.mv>=2&&!b.p&&b.y>(this.mv>2?1405:1330)&&b.y<(this.mv>2?1435:1380)){b.p=1;if(r()<.3){b.vy=-520;b.vx=(r()-.5)*(this.mv>2?60:200);b.bt2=this.t}}
  const v=Math.hypot(b.vx,b.vy);if(v>1200){b.vx*=1200/v;b.vy*=1200/v}
  b.s=v<20?b.s+dt:0;if(b.s>1.5){b.vx=(r()-.5)*400;b.vy=-250;b.s=0}
 }
 for(let i=0;i<al.length;i++)for(let k=i+1;k<al.length;k++){const a=al[i],c=al[k],dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy);
  if(d<2*R&&d>.01){const nx=dx/d,ny=dy/d,o=(2*R-d)/2;a.x-=nx*o;a.y-=ny*o;c.x+=nx*o;c.y+=ny*o;const vn=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;
   if(vn<0){a.vx+=.75*vn*nx;a.vy+=.75*vn*ny;c.vx-=.75*vn*nx;c.vy-=.75*vn*ny}}}
 for(const b of al)if(b.y>GY){b.done=true;this.order.push(b)}
 const left=this.b.filter(b=>!b.done);
 if(this.mode==='first'?this.order.length>=1:!left.length)this.fin=true;
 if(this.t>150){left.sort((a,c)=>c.y-a.y).forEach(b=>{b.done=true;this.order.push(b)});this.fin=true}
 if(this.fin)this.winner=this.mode==='first'?this.order[0]:this.order[this.order.length-1];
};
function push(b,px,py,pr,vx,vy,k){const dx=b.x-px,dy=b.y-py,d=Math.hypot(dx,dy),m=R+pr;
 if(d<m&&d>.01){const nx=dx/d,ny=dy/d;b.x=px+nx*m;b.y=py+ny*m;const vn=(b.vx-vx)*nx+(b.vy-vy)*ny;if(vn<0){b.vx-=k*vn*nx;b.vy-=k*vn*ny}}}
function seg(b,ax,ay,bx,by,w,cx,cy){const ex=bx-ax,ey=by-ay;let t=((b.x-ax)*ex+(b.y-ay)*ey)/(ex*ex+ey*ey);t=Math.max(0,Math.min(1,t));
 const px=ax+ex*t,py=ay+ey*t;push(b,px,py,2.5,-w*(py-cy),w*(px-cx),1.6)}

const cv=$('#cv'),cx=cv.getContext('2d');let acc=0,sim=null,raf=0,spd=1,cam=0,runId=null,onEnd=null,ended=false;
function play(cfg,end){cancelAnimationFrame(raf);sim=new Sim(cfg.seed,cfg.names,cfg.mode,cfg.jp,cfg.mv);cam=0;ended=false;onEnd=end;$('#win').textContent='';loop()}
function loop(){
 acc+=0.2*spd*(sim.b.some(b=>!b.done&&b.y>1300)?.75:1);while(acc>=1&&!sim.fin){sim.step();acc--}
 draw();
 $('#rank').innerHTML='';sim.order.forEach((b,i)=>{const s=document.createElement('span');s.textContent=(i+1)+'. '+b.n;$('#rank').append(s)});
 if(sim.fin){if(!ended){ended=true;$('#win').textContent='🏆 당첨: '+sim.winner.n;onEnd&&onEnd(sim)}return}
 raf=requestAnimationFrame(loop);
}
function draw(){
 const al=sim.b.filter(b=>!b.done);let ty=0;const f=Math.min(1,acc),ia=sim.ang-(1-f)/120;
 if(al.length){const hi=al.length>2&&sim.t%10>8;ty=hi?Math.min(...al.map(b=>b.y)):Math.max(...al.map(b=>b.y))}else ty=GY;if(sim.jb&&!sim.jb.done&&sim.t-sim.jt<2.5)ty=sim.jb.y;
 cam+=(Math.max(0,Math.min(H-600,ty-300))-cam)*.08;
 cx.setTransform(2,0,0,2,0,0);cx.clearRect(0,0,400,600);cx.translate(0,-cam);
 cx.fillStyle='#ff9a4d33';JET.forEach(z=>cx.fillRect(z[0],z[1],z[2]-z[0],z[3]-z[1]));
 cx.fillStyle='#ffb36b';cx.font='bold 10px sans-serif';cx.textAlign='center';JET.forEach(z=>{const m=(z[0]+z[2])/2,y=(z[1]+z[3])/2;cx.fillText('확률',m,y-10);cx.fillText('JUMP',m,y+3);cx.fillText('50%',m,y+16)});cx.textAlign='left';
 if(sim.mv>2){cx.fillStyle='#7aa2ff44';cx.fillRect(150,1405,100,30);cx.fillStyle='#9db8ff';cx.font='bold 10px sans-serif';cx.textAlign='center';cx.fillText('LAST JUMP 30%',200,1424);cx.textAlign='left'}else if(sim.mv>=2){cx.fillStyle='#7aa2ff22';cx.fillRect(0,1330,W,50);cx.fillStyle='#9db8ff';cx.font='bold 10px sans-serif';cx.textAlign='center';cx.fillText('LAST JUMP 30%',60,1359);cx.fillText('LAST JUMP 30%',340,1359);cx.textAlign='left'}
 cx.fillStyle='#8a86a0';pegs.forEach(p=>{cx.beginPath();cx.arc(p[0],p[1],5,0,7);cx.fill()});
 cx.strokeStyle='#d36b4a';cx.lineWidth=5;cx.lineCap='round';
 (sim.mv>=2?SPX:SP).forEach(s=>{const c=Math.cos(ia*s.w)*s.l,n=Math.sin(ia*s.w)*s.l;cx.beginPath();cx.moveTo(s.x-c,s.y-n);cx.lineTo(s.x+c,s.y+n);cx.stroke()});
 cx.strokeStyle='#8a86a0';SEG.forEach(g=>{cx.beginPath();cx.moveTo(g[0],g[1]);cx.lineTo(g[2],g[3]);cx.stroke()});
 cx.strokeStyle='#4ade80';cx.lineWidth=3;cx.beginPath();cx.moveTo(0,GY);cx.lineTo(W,GY);cx.stroke();
 cx.fillStyle='#4ade80';cx.fillText('GOAL',175,GY+16);
 cx.font='9px sans-serif';cx.textAlign='center';const sv=al.map(b=>[b.x,b.y]);al.forEach(b=>{if(b.px!=null){b.x=b.px+(b.x-b.px)*f;b.y=b.py+(b.y-b.py)*f}});
 for(const b of al){
  if(sim.t-b.bt<.5){cx.fillStyle='#ffd16655';cx.beginPath();cx.arc(b.x,b.y,16,0,7);cx.fill();cx.fillStyle='#ffd166';cx.fillText('JUMP!',b.x,b.y-20)}
  if(sim.t-b.bt2<.8){cx.fillStyle='#9db8ff';cx.fillText('LAST JUMP!',b.x,b.y-20)}
  cx.fillStyle='hsl('+b.h+',75%,58%)';cx.beginPath();cx.arc(b.x,b.y,R,0,7);cx.fill();
  cx.fillStyle='#fff';cx.fillText(b.n,b.x,b.y-10)}al.forEach((b,i)=>{b.x=sv[i][0];b.y=sv[i][1]});
 cx.textAlign='left';
}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>spd=+b.dataset.s);

// ---------- app (static) ----------
const DATA={title:'⚔️ 우리 길드',tag:'길드장이 전하는 공지 게시판',
notice:[{t:'길드 홈페이지가 열렸어요',b:'앞으로 공지는 여기서 확인해 주세요.',d:'2026-10-25',p:1}],
event:[{t:'이벤트 안내 예시',b:'이벤트 내용을 여기에 적습니다.',d:'2026-10-25'}],
members:['길드원1','길드원2','길드원3','길드원4','길드원5','길드원6','길드원7','길드원8'],
results:[]};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const KEYS=[['notice','📢 공지'],['event','🎉 이벤트'],['result','🏆 경기결과'],['pin','🎱 핀볼']];
function tab(k){KEYS.forEach(t=>$('#v-'+t[0]).classList.toggle('hide',t[0]!==k));document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));if(k!=='pin')cancelAnimationFrame(raf)}
KEYS.forEach(t=>{const b=document.createElement('button');b.dataset.k=t[0];b.textContent=t[1];b.onclick=()=>tab(t[0]);$('#tabs').append(b)});
$('#h1').textContent=DATA.title;$('#tag').textContent=DATA.tag;$('#who').classList.add('hide');
['notice','event'].forEach(k=>{const it=[...DATA[k]].sort((a,b)=>(b.p?1:0)-(a.p?1:0));
 $('#v-'+k).innerHTML=it.length?it.map(p=>`<div class="card"><h3>${p.p?'📌 ':''}${esc(p.t)}</h3><div class="d">${esc(p.d)}</div><p>${esc(p.b)}</p></div>`).join(''):'<div class="empty">아직 게시글이 없어요.</div>'});
const ML={first:'먼저 골인',last:'마지막 골인'};
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=c=>JSON.parse(decodeURIComponent(escape(atob(c.trim()))));
{const el=$('#v-result');
 el.innerHTML='<div class="card"><div class="d">리플레이 코드가 있으면 붙여넣어 보세요</div><input id="rc" placeholder="코드 붙여넣기"><button class="btn" id="rb">리플레이 보기</button><div class="d" id="rm"></div></div><div id="rl"></div>';
 $('#rl').innerHTML=DATA.results.length?'':'<div class="empty">아직 경기 결과가 없어요.</div>';
 DATA.results.forEach(r=>{const c=document.createElement('div');c.className='card';c.style.cursor='pointer';
  c.innerHTML=`<h3>${esc(r.title)}</h3><div class="d">${esc(r.d)} · ${ML[r.mode]} 방식 · 참가 ${r.names.length}명</div><p>🎬 <b>결과확인</b> <span style="color:var(--mu)">(눌러서 리플레이로 당첨자 확인)</span></p>`;
  c.onclick=()=>{tab('pin');play(r)};$('#rl').append(c)});
 $('#rb').onclick=()=>{try{const c=dec($('#rc').value);tab('pin');play(c)}catch(e){$('#rm').textContent='코드를 확인해 주세요.'}};}
if(location.hash==='#admin')$('#adm').classList.remove('hide');
$('#names').value=DATA.members.join('\n');
$('#go').onclick=()=>{
 const names=$('#names').value.split('\n').map(s=>s.trim()).filter(Boolean);
 if(names.length<2){$('#win').textContent='길드원을 2명 이상 입력하세요.';return}
 const cfg={seed:Math.floor(Math.random()*2e9),names,mode:$('#mode').value,jp:.5,mv:3};
 $('#code').classList.add('hide');
 play(cfg,()=>{const c=$('#code');c.value=enc(cfg);c.classList.remove('hide')});
};
{const c=document.createElement('textarea');c.id='code';c.readOnly=true;c.className='hide';c.onclick=()=>c.select();$('#adm').append(c)}
tab('notice');
</script></body></html>
